[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "denuo-hns-topology"
version = "0.1.0"
description = "Handshake namespace topology and DANE-readiness report tooling."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Denuo"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "cryptography>=42",
  "dnspython>=2.6",
]

[project.urls]
Homepage = "https://github.com/handshake-rs/hns-dane-crawler"
Repository = "https://github.com/handshake-rs/hns-dane-crawler.git"
Issues = "https://github.com/handshake-rs/hns-dane-crawler/issues"
Documentation = "https://github.com/handshake-rs/hns-dane-crawler/tree/main/docs"
Changelog = "https://github.com/handshake-rs/hns-dane-crawler/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[project.scripts]
hns-topology = "hns_topology.cli:main"
hns-live-directory = "hns_topology.live_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hns_topology = ["site_assets/*", "live_site_assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
