name: Package release preflight

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact lowercase 40-character commit on main to package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: package-release-preflight-${{ inputs.expected_commit }}
  cancel-in-progress: false

jobs:
  package-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate requested source
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          if ! [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_commit must be one lowercase 40-character Git commit" >&2
            exit 1
          fi
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false
      - name: Verify exact clean checkout
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install locked environment
        run: |
          python -m pip install --requirement requirements-dev.lock
          python -m pip check
      - name: Validate release source
        run: python scripts/check-package-release.py
      - name: Build and verify source and wheel candidates
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          python scripts/build-package-candidate.py \
            --expected-commit "$EXPECTED_COMMIT" \
            --expected-ref refs/heads/main \
            --output-dir "$RUNNER_TEMP/package-candidate"
      - name: Retain package candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: denuo-hns-topology-0.1.0-${{ inputs.expected_commit }}
          path: ${{ runner.temp }}/package-candidate/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
