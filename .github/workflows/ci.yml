name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --requirement requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps --editable .
          python -m pip check
      - name: Lint
        run: ruff check .
      - name: Script syntax
        run: |
          bash -n scripts/*.sh
          node --check scripts/hsd-export-names-jsonl.js
      - name: Test
        run: pytest
      - name: Fixture site
        run: |
          hns-topology bootstrap-fixture --fixture tests/fixtures/sample_hsd_names.json --db data/topology.sqlite
          hns-topology generate-site --db data/topology.sqlite --out public
          hns-topology validate-release --db data/topology.sqlite --public-dir public
          hns-topology validate-public --public-dir public
          hns-topology archive-release --db data/topology.sqlite --public-dir public --out-dir archives --keep 2
          hns-topology validate-archive --manifest "$(find archives -name '*-manifest.json' -print -quit)"
          test "$(find archives -name '*-manifest.json' | wc -l)" -eq 1
          test "$(find archives -name '*-site.tar.gz' | wc -l)" -eq 1
          test "$(find archives -name '*-topology.sqlite.gz' | wc -l)" -eq 1
