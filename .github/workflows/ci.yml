name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --requirement requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps --editable .
          python -m pip check
      - name: Lint
        run: ruff check .
      - name: Package identity
        run: python scripts/check-package-release.py
      - name: Script syntax
        run: |
          bash -n scripts/*.sh
          node --check scripts/hsd-export-names-jsonl.js
      - name: Test
        run: pytest
      - name: Fixture site
        run: |
          hns-topology bootstrap-fixture --fixture tests/fixtures/sample_hsd_names.json --db data/topology.sqlite
          hns-topology generate-site --db data/topology.sqlite --out public
          hns-topology validate-release --db data/topology.sqlite --public-dir public
          hns-topology validate-public --public-dir public
          hns-topology archive-release --db data/topology.sqlite --public-dir public --out-dir archives --keep 2
          hns-topology validate-archive --manifest "$(find archives -name '*-manifest.json' -print -quit)"
          test "$(find archives -name '*-manifest.json' | wc -l)" -eq 1
          test "$(find archives -name '*-site.tar.gz' | wc -l)" -eq 1
          test "$(find archives -name '*-topology.sqlite.gz' | wc -l)" -eq 1
      - name: Build and verify candidate wheel
        run: |
          mkdir -p "$RUNNER_TEMP/package-dist" "$RUNNER_TEMP/package-install"
          python -m pip wheel --no-build-isolation --no-deps \
            --wheel-dir "$RUNNER_TEMP/package-dist" .
          python -m pip install --no-deps --target "$RUNNER_TEMP/package-install" \
            "$RUNNER_TEMP"/package-dist/*.whl
          PYTHONPATH="$RUNNER_TEMP/package-install" python - <<'PY'
          from importlib.metadata import version
          import hns_topology

          installed = version("denuo-hns-topology")
          assert installed == hns_topology.__version__, (installed, hns_topology.__version__)
          print(f"verified denuo-hns-topology {installed}")
          PY
          cd "$RUNNER_TEMP/package-dist"
          sha256sum -- *.whl > SHA256SUMS
      - name: Retain exact-commit wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: denuo-hns-topology-${{ github.sha }}
          path: |
            ${{ runner.temp }}/package-dist/*.whl
            ${{ runner.temp }}/package-dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
